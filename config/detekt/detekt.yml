# Se parte de la config por defecto de detekt (buildUponDefaultConfig) y aca solo se ajusta lo propio.
complexity:
  TooManyFunctions:
    # Un @RestControllerAdvice tiene un handler por excepcion y el engine un helper por regla:
    # muchas funciones chicas es lo esperado (el engine suma interpretForTest para correr tests sin prompts).
    thresholdInClasses: 22
style:
  ReturnCount:
    # parse() corta con return null en cada etapa (lexer, parser, semantico).
    max: 4
  MagicNumber:
    excludes: ['**/test/**']
naming:
  FunctionNaming:
    # Los tests usan nombres con backticks: `hace tal cosa`.
    excludes: ['**/test/**']
