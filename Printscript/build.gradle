plugins {
	id 'org.jetbrains.kotlin.jvm' version '2.2.20'
	id 'org.jetbrains.kotlin.plugin.spring' version '2.2.20'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.grupo2'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

kotlin {
	compilerOptions {
		// Las anotaciones de validacion (@NotBlank) en parametros del constructor se aplican tambien al campo.
		freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
	}
}

repositories {
	mavenCentral()
	maven {
		name = "GitHubPackages"
		url = uri("https://maven.pkg.github.com/printScript-ingsis-vlt/print-script-ingsis")
		credentials {
			username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_USER") ?: System.getenv("GITHUB_ACTOR")
			password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
		}
	}
}

dependencies {
	// Spring
	implementation 'org.springframework.boot:spring-boot-starter-web'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Kotlin
	implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
	implementation 'org.jetbrains.kotlin:kotlin-reflect'
	testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'

	// Tu lenguaje
	implementation 'com.printscript:common-ast:1.2.0'
	implementation 'com.printscript:common-lexer-parser:1.2.0'
	implementation 'com.printscript:common-result:1.2.0'
	implementation 'com.printscript:common-runtime:1.2.0'
	implementation 'com.printscript:lexer:1.2.0'
	implementation 'com.printscript:parser:1.2.0'
	implementation 'com.printscript:semantic:1.2.0'
	implementation 'com.printscript:interpreter:1.2.0'
	implementation 'com.printscript:formatter:1.2.0'
	implementation 'com.printscript:linter:1.2.0'
	implementation 'com.printscript:pipeline:1.2.0'
	implementation 'org.json:json:20240303'
}

tasks.named('jar') { enabled = false }   // evita el -plain.jar

tasks.named('test') {
	useJUnitPlatform()
}