spring.application.name=Printscript

# Actuator: solo /actuator/health, sin detalles de componentes (responde {"status":"UP"}).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Asset Service: guarda snippets y reglas en el bucket. En docker-compose apunta a http://asset_service:8080.
asset.url=${ASSET_SERVICE_URL:http://localhost:8081}
asset.container=${ASSET_SERVICE_CONTAINER:${ASSET_CONTAINER:snippets}}
asset.connect-timeout=2s
asset.read-timeout=10s

src/main/resources/application.properties# Cuanto puede tardar en ejecutarse un snippet (interpret y /test) antes de cortarlo.
# Quien llama al engine (snippet-service) tiene que esperar mas que esto.
engine.execution-timeout=${ENGINE_EXECUTION_TIMEOUT:10s}

# Redis Streams: snippet-service publica pedidos de lint/format y el engine responde.
# En el Swarm REDIS_HOST=redis y la password llega por configtree (spring.data.redis.password).
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=5s
# Redis no es necesario para la API HTTP: que se caiga no tiene que marcar al engine como DOWN
# (Swarm lo reiniciaria sin motivo). Los listeners se reconectan solos.
management.health.redis.enabled=false

# false apaga listeners y reclaimer (lo usan los tests que no levantan Redis).
streams.enabled=${STREAMS_ENABLED:true}
streams.group=printscript-engine
# Nombre del consumer dentro del grupo: unico por replica (en Swarm, el hostname del contenedor).
streams.consumer=${HOSTNAME:printscript-engine-local}
streams.lint-requests=lint-requests
streams.format-requests=format-requests
streams.lint-results=lint-results
streams.format-results=format-results
streams.dead-letter-suffix=-dlq
# Cuantas veces se entrega un pedido antes de darlo por perdido (DLQ + respuesta FAILED).
streams.max-deliveries=3
# Un pedido sin ack por mas de reclaim-idle se reintenta (el consumer pudo haber muerto).
streams.reclaim-idle=60s
streams.reclaim-interval=PT30S
streams.max-length=10000
